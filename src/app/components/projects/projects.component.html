<section id="projects" class="section">
  <h2 class="section-title">{{ 'projects.title' | translate }}</h2>
  <div class="projects-grid">
    <mat-card class="project-card" *ngFor="let project of projects">
      <mat-card-header>
        <mat-card-title>{{ project.name }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ project.description }}</p>
      </mat-card-content>
      <mat-card-actions>
        <mat-chip-listbox aria-label="Technologies">
          <mat-chip *ngFor="let tech of project.techs">{{ tech }}</mat-chip>
        </mat-chip-listbox>
      </mat-card-actions>
    </mat-card>
  </div>
</section>
