<section class="hero" id="hero">
  <div class="hero-content">
    <div class="status-badge">
      <span class="status-dot status-dot--green"></span>
      {{ 'hero.available' | translate }}
    </div>

    <h1 class="hero-name">
      {{ 'hero.greeting' | translate }}
      <span class="hero-name-highlight">{{ 'hero.name' | translate }}</span>
    </h1>

    <p class="hero-title">{{ 'hero.title' | translate }}</p>

    <div class="hero-roles">
      <div class="hero-role">
        <span class="status-dot status-dot--cyan"></span>
        <div class="role-text">
          <strong>{{ 'hero.role1' | translate }}</strong>
          <span class="role-sub">{{ 'hero.role1Sub' | translate }}</span>
        </div>
      </div>
      <div class="hero-role">
        <span class="status-dot status-dot--cyan"></span>
        <div class="role-text">
          <strong>{{ 'hero.role2' | translate }}</strong>
          <span class="role-sub">{{ 'hero.role2Sub' | translate }}</span>
        </div>
      </div>
    </div>

    <p class="hero-tagline">{{ 'hero.tagline' | translate }}</p>

    <div class="cta-group">
      <a href="#contact" class="cta-link">
        <button mat-stroked-button class="cta-button cta-button--primary">{{ 'hero.cta' | translate }}</button>
      </a>
      <a href="#projects" class="cta-link">
        <button mat-stroked-button class="cta-button cta-button--secondary">{{ 'hero.ctaSecondary' | translate }}</button>
      </a>
    </div>
  </div>
</section>
