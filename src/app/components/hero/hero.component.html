<section class="hero" id="hero">
  <div class="hero-content">
    <h1 class="hero-name">{{ 'hero.name' | translate }}</h1>
    <p class="hero-title">{{ 'hero.title' | translate }}</p>
    <p class="hero-tagline">{{ 'hero.tagline' | translate }}</p>
    <button mat-raised-button color="accent" class="cta-button">{{ 'hero.cta' | translate }}</button>
  </div>
</section>
