<section id="skills" class="section">
  <h2 class="section-title">{{ 'skills.title' | translate }}</h2>
  <div class="skills-grid">
    <mat-card class="skill-card" *ngFor="let cat of skills">
      <mat-card-header>
        <mat-card-title>{{ cat.category }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-chip-listbox aria-label="Skills">
          <mat-chip *ngFor="let item of cat.items">{{ item }}</mat-chip>
        </mat-chip-listbox>
      </mat-card-content>
    </mat-card>
  </div>
</section>
